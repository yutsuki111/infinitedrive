
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SCR-06 部屋作成画面</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <a href="index.html">←</a>
        <h1>部屋作成</h1>
    </header>

    <main>
        <form>
            <!-- 部屋名 -->
            <label for="room_name">部屋名</label>
            <input
                type="text"
                id="room_name"
                name="room_name"
                placeholder="例:週末ドライブ（一人でもおけ）"
                required
            >

            <!-- 合言葉 -->
            <label for="password">合言葉</label>
            <input
                type="text"
                id="password"
                name="password"
                placeholder="半角英数字で入力"
                required
            >

            <!-- 参加ニックネーム -->
            <label for="nickname">参加ニックネーム</label>
            <input
                type="text"
                id="nickname"
                name="nickname"
                placeholder="例：たろう"
                required
            >

            <!-- 作成ボタン -->
            <button type="submit">作成</button>


        </form>
    </main>

</body>
</html>

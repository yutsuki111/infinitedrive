<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SCR-02 アカウント登録画面</title>
</head>
<body>
  <h1>SCR-02 アカウント登録画面（作成中）</h1>
    <p>ユーザーID<br>
    <input type ="text" name="user_id" placeholder="ユーザーID"></p>
    <p>パスワード<br>
    <input type ="text" name="password" placeholder="8文字以上"></p>
    <p>8文字以上で入力してください。</p>
    <p>パスワード確認<br>
    <input type ="text" name="password" placeholder="もう一度入力"></p>
    <p><input type="submit" value="登録"></p>
</body>
</html>

{% extends "driveapp/base.html" %}
{% block page_title %}ログイン{% endblock  %}

{% block content %}
  {% include "driveapp/includes/logo.html" %}
  <form>
    <p><sub style="color:var(--text-sub);">ユーザーID</sub><br>
    <input type ="text" name="user_id" placeholder="ユーザーID"></p>
    <p><sub style="color:var(--text-sub);">パスワード</sub><br>
    <input type ="text" name="password" placeholder="パスワード"></p>
    <p><input type="submit" value="ログイン" class="btn btn-primary"></p>
  </form>
  <p><a href="{% url 'driveapp:register' %}" style="color:var(--link);">新規登録へ→</a></p>
{% endblock %}
